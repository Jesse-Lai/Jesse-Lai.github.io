<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atoms</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Schoolbell&family=Special+Elite&display=swap');
    @font-face { font-family: 'Red Hat Mono'; src: url('fonts/RedHatMono-Regular.woff2') format('woff2'); font-weight: 400; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #999; font-family: 'Red Hat Mono', monospace; height: 100vh; overflow: hidden; }
    a { color: #555; text-decoration: none; transition: color 0.2s; font-size: 13px; }
    a:hover { color: #fff; }

    #layout { display: flex; height: 100vh; }
    #left { flex: 1; display: flex; flex-direction: column; position: relative; }
    nav { padding: 16px 24px; position: absolute; top: 0; left: 0; z-index: 10; }
    #preview { flex: 1; position: relative; }
    #preview canvas { display: block; }
    #atom-name {
      position: absolute; bottom: 100px; left: 50%;
      transform: translateX(-50%);
      font-size: 11px; color: #333; letter-spacing: 3px;
      text-transform: uppercase; z-index: 10;
    }
    #atom-bar {
      height: 80px; padding: 12px 0;
      display: flex; align-items: center; justify-content: center; gap: 16px;
    }
    .atom-thumb {
      height: 48px; border: none; background: none;
      cursor: pointer; transition: opacity 0.2s;
      opacity: 0.25; overflow: hidden; border-radius: 3px;
    }
    .atom-thumb:hover { opacity: 0.5; }
    .atom-thumb.active { opacity: 1; }
    .atom-thumb img { height: 100%; width: auto; display: block; }

    /* Right panel */
    #panel {
      width: 300px; border-left: 1px solid #1a1a1a;
      overflow-y: auto; padding: 20px;
      font-size: 12px; line-height: 1.6;
    }
    #panel h2 { font-size: 13px; color: #ccc; font-weight: 500; letter-spacing: 1px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    #panel-collapse { background: none; border: none; color: #555; cursor: pointer; font-size: 16px; padding: 0 4px; transition: color 0.2s; }
    #panel-collapse:hover { color: #fff; }
    #panel.collapsed { width: 40px; min-width: 40px; padding: 20px 8px; overflow: hidden; }
    #panel.collapsed h2 span, #panel.collapsed .desc, #panel.collapsed #panel-props { display: none; }
    #panel { transition: width 0.2s; }
    #panel .desc { color: #555; margin-bottom: 20px; font-size: 11px; }
    .prop-section { margin-bottom: 16px; }
    .prop-section-title {
      font-size: 10px; color: #444; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .prop-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 0; border-bottom: 1px solid #111;
    }
    .prop-label { color: #666; font-size: 11px; }
    .prop-value input[type="number"] {
      width: 60px; background: #111; border: 1px solid #222;
      color: #ccc; padding: 3px 6px; font-family: 'Red Hat Mono', monospace;
      font-size: 11px; border-radius: 3px; text-align: right;
    }
    .prop-value input[type="number"]:focus { border-color: #444; outline: none; }
    .prop-value input[type="checkbox"] { accent-color: #666; }
    .prop-value select {
      background: #111; border: 1px solid #222; color: #ccc;
      padding: 3px 6px; font-family: 'Red Hat Mono', monospace;
      font-size: 11px; border-radius: 3px;
    }
    .prop-value span { color: #555; font-size: 11px; }
    .tag { display: inline-block; padding: 1px 6px; background: #1a1a1a; border-radius: 3px; color: #666; font-size: 10px; margin: 1px; }

    #panel-toggle {
      display: none; position: fixed; bottom: 90px; right: 16px; z-index: 20;
      width: 36px; height: 36px; border-radius: 50%;
      background: none; border: 1px solid #333; color: #666;
      cursor: pointer; font-size: 14px; transition: all 0.2s;
    }
    #panel-toggle:hover { border-color: #666; color: #fff; }
    #panel-toggle.open { color: #fff; border-color: #555; }

    @media (max-width: 768px) {
      #layout { flex-direction: column; }
      #panel {
        position: fixed; top: 0; right: 0; bottom: 0; width: 280px;
        transform: translateX(100%); transition: transform 0.3s;
        z-index: 50; background: #0a0a0a;
      }
      #panel.open { transform: translateX(0); }
      #panel-toggle { display: flex; align-items: center; justify-content: center; }
      #atom-bar { height: 64px; padding: 8px 0; }
      .atom-thumb { height: 40px; }
      #atom-name { bottom: 72px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div id="layout">
    <div id="left">
      <nav><a href="index.html">← Back</a></nav>
      <div id="preview"></div>
      <div id="atom-name">Sticker</div>
      <div id="atom-bar">
        <div class="atom-thumb active" data-atom="sticker" onclick="switchAtom('sticker')"><img src="sticker.png"></div>
        <div class="atom-thumb" data-atom="photo" onclick="switchAtom('photo')"><img src="photo3.png"></div>
        <div class="atom-thumb" data-atom="clip" onclick="switchAtom('clip')" style="width:56px;display:flex;align-items:center;justify-content:center;">
          <svg width="48" height="56" viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="12" width="32" height="38" rx="2" fill="#2a2a2a" transform="rotate(-4 6 12)"/>
            <rect x="9" y="9" width="32" height="38" rx="2" fill="#333" transform="rotate(2 9 9)"/>
            <rect x="8" y="6" width="32" height="38" rx="2" fill="#444" transform="rotate(5 8 6)"/>
            <path d="M28 2 L28 20 Q28 24 24 24 L16 24 Q12 24 12 20 L12 6 Q12 2 16 2 L20 2 Q22 2 22 4 L22 16" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
      <div class="atom-thumb" data-atom="stamp" onclick="switchAtom('stamp')"><img src="stamp1.webp" style="border-radius:2px;"></div>
        <div class="atom-thumb" data-atom="sticky" onclick="switchAtom('sticky')" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:#fff9c4;border-radius:3px;font-size:10px;color:#666;">Note</div>
      </div>
    </div>
    <button id="panel-toggle" onclick="togglePanel()">⚙</button>
    <div id="panel">
      <h2 id="panel-name"><span>Sticker</span><button id="panel-collapse" onclick="collapsePanel()">◀</button></h2>
      <div class="desc" id="panel-desc">粒子化贴纸，支持 morph 变换</div>
      <div id="panel-props"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
  <script type="module">
    import { loadImagePixels, sampleImage, sampleDominantColor, AtomSticker, renderPhoto, renderClip, renderStamp, renderStickyNote, makeDraggable, PhotoSystem } from "./atoms-renderer.js?v=73";
    let app, currentAtom = 'sticker', sticker = null, atomsConfig = {};

    const atomImages = {
      sticker: { images: ['sticker.png', 'sticker2.png'], type: 'sticker' },
      photo: { images: ['photo_fishing.jpg'], type: 'photo', caption: 'Big catch!', date: "'25 06 15" },
      clip: { images: ['photo_flowers.png', 'photo_ski.png', 'photo_avalanche.png'], type: 'clip' },
      stamp: { images: ['stamp2.png'], type: 'stamp' },
      sticky: { images: ['stamp1.webp'], type: 'sticky', title: 'Generative UI', body: 'GenUI replaces inefficient text-only AI responses with AI-generated, structured, interactive interfaces.', date: "'26 05 12" },
      
    };

    // Load config
    async function loadConfig() {
      const r = await fetch('atoms-config.json');
      atomsConfig = await r.json();
    }

    function renderPanel(name) {
      const cfg = atomsConfig[name];
      if (!cfg) return;
      document.getElementById('panel-name').querySelector('span').textContent = cfg.name;
      document.getElementById('panel-desc').textContent = cfg.description;
      const container = document.getElementById('panel-props');
      container.innerHTML = '';

      function addSection(title, obj, path) {
        const sec = document.createElement('div');
        sec.className = 'prop-section';
        sec.innerHTML = `<div class="prop-section-title">${title}</div>`;
        for (const [key, val] of Object.entries(obj)) {
          const row = document.createElement('div');
          row.className = 'prop-row';
          let valHtml = '';
          if (typeof val === 'boolean') {
            valHtml = `<input type="checkbox" ${val ? 'checked' : ''} onchange="updateProp('${name}','${path}.${key}',this.checked)">`;
          } else if (typeof val === 'number') {
            valHtml = `<input type="number" value="${val}" step="${val < 1 ? 0.01 : val < 10 ? 0.1 : 1}" onchange="updateProp('${name}','${path}.${key}',parseFloat(this.value))">`;
          } else if (typeof val === 'string') {
            valHtml = `<span>${val}</span>`;
          } else if (Array.isArray(val)) {
            valHtml = val.map(v => `<span class="tag">${v}</span>`).join('');
          } else if (val === null) {
            valHtml = `<span>—</span>`;
          } else if (typeof val === 'object') {
            valHtml = `<span>${JSON.stringify(val)}</span>`;
          }
          row.innerHTML = `<span class="prop-label">${key}</span><span class="prop-value">${valHtml}</span>`;
          sec.appendChild(row);
        }
        container.appendChild(sec);
      }

      if (cfg.style) addSection('Style', cfg.style, 'style');
      if (cfg.behavior) addSection('Behavior', cfg.behavior, 'behavior');
      if (cfg.boundary) addSection('Boundary', cfg.boundary, 'boundary');
      if (cfg.combines) {
        const sec = document.createElement('div');
        sec.className = 'prop-section';
        sec.innerHTML = `<div class="prop-section-title">Combines with</div><div>${cfg.combines.map(c=>`<span class="tag">${c}</span>`).join(' ')}</div>`;
        container.appendChild(sec);
      }
    }

    function updateProp(atomName, path, value) {
      const keys = path.split('.');
      let obj = atomsConfig[atomName];
      for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
      obj[keys[keys.length - 1]] = value;
      // Re-render preview with new config
      loadAtom(currentAtom);
      console.log(`Updated ${atomName}.${path} = ${value}`);
    }

    // ─── Rendering (same as before) ───
    let extraContainers = [];
    let cleanups = []; let loadGeneration = 0;
    async function loadAtom(name) {
      // Clear everything from stage
      loadGeneration++; while(app.stage.children.length > 0) app.stage.removeChildAt(0);
      if(typeof clipTimer !== "undefined" && clipTimer) clearTimeout(clipTimer);
      sticker = null;
      extraContainers = [];
      cleanups.forEach(c=>{if(c&&c.destroy)c.destroy();}); cleanups=[];
      const imgCfg = atomImages[name];
      const cfg = atomsConfig[name];
      const W=app.screen.width, H=app.screen.height;

      if(imgCfg.type==='lure'){
        const {group, hitTest} = renderLure(app, W/2, H/2-20, cfg);
        app.stage.addChild(group);extraContainers.push(group);
        cleanups.push(makeDraggable(app.canvas, group, hitTest));
        return;
      }
      if(imgCfg.type==='clip'){
        // Use PhotoSystem for full merge/split cycle
        const clipPS = new PhotoSystem(app, app.canvas, atomsConfig);
        const cx = W/2, cy = H/2 - 20;
        const targetW = W * 0.15;
        // Add photos close together so they auto-overlap
        for (let i=0; i<imgCfg.images.length; i++) {
          const clipCaptions=[{caption:'Powder day',date:"'25 01 15"},{caption:'Wildflowers',date:"'25 05 10"},{caption:'Avalanche!',date:"'25 02 08"}];
          await clipPS.addPhoto(imgCfg.images[i], cx + i*8, cy + i*10, null, clipCaptions[i]||{});
        }
        // Auto-merge after render
        const gen = loadGeneration; setTimeout(async () => { if(loadGeneration !== gen) return;
          if (clipPS.photos.length >= 2) {
            for (let i=1; i<clipPS.photos.length; i++) {
              await clipPS._mergePhotos(clipPS.photos[i], clipPS.photos[0]);
            }
          }
        }, 500);
        return;
      }
      if(imgCfg.type==='stamp'){
        const stampImg = await loadImagePixels(imgCfg.images[0]);
        const {group, hitTest} = await renderStamp(app, stampImg, W/2-100, H/2-82);
        app.stage.addChild(group);extraContainers.push(group);
        cleanups.push(makeDraggable(app.canvas, group, hitTest));
        return;
      }
      if(imgCfg.type==='sticky'){
        const stampImg = imgCfg.images[0] ? await loadImagePixels(imgCfg.images[0]) : null;
        const {group, hitTest} = await renderStickyNote(app, W/2-140, H/2-150, {title:imgCfg.title, body:imgCfg.body, date:imgCfg.date}, stampImg);
        app.stage.addChild(group);extraContainers.push(group);
        cleanups.push(makeDraggable(app.canvas, group, hitTest));
        return;
      }
      if(imgCfg.type==='photo'){
        const imgA=await loadImagePixels(imgCfg.images[0]);
        const maxW2=W*0.4,maxH2=H*0.5;
        const scale=Math.min(maxW2/imgA.w,maxH2/imgA.h);
        const {group, hitTest} = await renderPhoto(app, imgA, W/2, H/2-20, scale, imgCfg, cfg);
        app.stage.addChild(group);extraContainers.push(group);
        cleanups.push(makeDraggable(app.canvas, group, hitTest));
        return;
      }

      // Sticker (default)
      const imgA=await loadImagePixels(imgCfg.images[0]);
      const imgB=imgCfg.images[1]?await loadImagePixels(imgCfg.images[1]):imgA;
      const maxW2=W*0.4,maxH2=H*0.5;
      const scale=Math.min(maxW2/imgA.w,maxH2/imgA.h);
      sticker=new AtomSticker(imgA,imgB,W/2,H/2-30,scale,cfg);
      app.stage.addChild(sticker.container);
    }

    function switchAtom(name) {
      currentAtom=name;
      document.querySelectorAll('.atom-thumb').forEach(el=>el.classList.toggle('active',el.dataset.atom===name));
      document.getElementById('atom-name').textContent=name.charAt(0).toUpperCase()+name.slice(1);
      renderPanel(name);
      document.fonts.ready.then(()=>loadAtom(name));
    }

    async function init() {
      await loadConfig();
      const preview=document.getElementById('preview');
      const W=preview.clientWidth,H=preview.clientHeight;
      app=new PIXI.Application();
      await app.init({width:W,height:H,resolution:window.devicePixelRatio||1,autoDensity:true,backgroundColor:0x0a0a0a});
      preview.appendChild(app.canvas);

      const mouse={x:-9999,y:-9999};let dragged=null;
      app.canvas.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(dragged)dragged.moveDrag(mouse.x,mouse.y);else if(sticker)sticker.setHover(sticker.hitTest(mouse.x,mouse.y));});
      app.canvas.addEventListener("mousedown",e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(sticker&&sticker.hitTest(mouse.x,mouse.y)){sticker.startDrag(mouse.x,mouse.y);dragged=sticker;}});
      app.canvas.addEventListener("mouseup",()=>{if(dragged){dragged.drop();dragged=null;}});

      let longPress=null,touchMoved=false;
      window.addEventListener("touchstart",e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;touchMoved=false;longPress=setTimeout(()=>{if(!touchMoved&&sticker&&sticker.hitTest(mouse.x,mouse.y)){sticker.startDrag(mouse.x,mouse.y);dragged=sticker;}},400);});
      window.addEventListener("touchmove",e=>{if(dragged)e.preventDefault();const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;touchMoved=true;if(longPress){clearTimeout(longPress);longPress=null;}if(dragged)dragged.moveDrag(mouse.x,mouse.y);},{passive:false});
      window.addEventListener("touchend",()=>{if(longPress){clearTimeout(longPress);longPress=null;}if(dragged){dragged.drop();dragged=null;}});

      app.ticker.add(ticker=>{const dt=Math.min(ticker.deltaMS/1000,0.05);if(sticker)sticker.update(dt);});

      renderPanel(currentAtom);
      await document.fonts.ready;
      await loadAtom(currentAtom);
    }
    function collapsePanel() {
      const p = document.getElementById("panel");
      const btn = document.getElementById("panel-collapse");
      p.classList.toggle("collapsed");
      btn.textContent = p.classList.contains("collapsed") ? "▶" : "◀";
    }
    function togglePanel() {
      const p = document.getElementById("panel");
      const b = document.getElementById("panel-toggle");
      p.classList.toggle("open");
      b.classList.toggle("open");
      b.textContent = p.classList.contains("open") ? "✕" : "⚙";
    }
    init();
    // Expose to global for onclick handlers
    window.switchAtom = switchAtom;
    window.updateProp = updateProp;
    window.collapsePanel = collapsePanel;
    window.togglePanel = togglePanel;
  </script>
</body>
</html>
