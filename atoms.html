<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atoms</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Schoolbell&display=swap');
    @font-face { font-family: 'Red Hat Mono'; src: url('fonts/RedHatMono-Regular.woff2') format('woff2'); font-weight: 400; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #999; font-family: 'Red Hat Mono', monospace; height: 100vh; overflow: hidden; }
    a { color: #555; text-decoration: none; transition: color 0.2s; font-size: 13px; }
    a:hover { color: #fff; }

    #layout { display: flex; height: 100vh; }
    #left { flex: 1; display: flex; flex-direction: column; position: relative; }
    nav { padding: 16px 24px; position: absolute; top: 0; left: 0; z-index: 10; }
    #preview { flex: 1; position: relative; }
    #preview canvas { display: block; }
    #atom-name {
      position: absolute; bottom: 100px; left: 50%;
      transform: translateX(-50%);
      font-size: 11px; color: #333; letter-spacing: 3px;
      text-transform: uppercase; z-index: 10;
    }
    #atom-bar {
      height: 80px; padding: 12px 0;
      display: flex; align-items: center; justify-content: center; gap: 16px;
    }
    .atom-thumb {
      height: 48px; border: none; background: none;
      cursor: pointer; transition: opacity 0.2s;
      opacity: 0.25; overflow: hidden; border-radius: 3px;
    }
    .atom-thumb:hover { opacity: 0.5; }
    .atom-thumb.active { opacity: 1; }
    .atom-thumb img { height: 100%; width: auto; display: block; }

    /* Right panel */
    #panel {
      width: 300px; border-left: 1px solid #1a1a1a;
      overflow-y: auto; padding: 20px;
      font-size: 12px; line-height: 1.6;
    }
    #panel h2 { font-size: 13px; color: #ccc; font-weight: 500; letter-spacing: 1px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    #panel-collapse { background: none; border: none; color: #555; cursor: pointer; font-size: 16px; padding: 0 4px; transition: color 0.2s; }
    #panel-collapse:hover { color: #fff; }
    #panel.collapsed { width: 40px; min-width: 40px; padding: 20px 8px; overflow: hidden; }
    #panel.collapsed h2 span, #panel.collapsed .desc, #panel.collapsed #panel-props { display: none; }
    #panel { transition: width 0.2s; }
    #panel .desc { color: #555; margin-bottom: 20px; font-size: 11px; }
    .prop-section { margin-bottom: 16px; }
    .prop-section-title {
      font-size: 10px; color: #444; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .prop-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 0; border-bottom: 1px solid #111;
    }
    .prop-label { color: #666; font-size: 11px; }
    .prop-value input[type="number"] {
      width: 60px; background: #111; border: 1px solid #222;
      color: #ccc; padding: 3px 6px; font-family: 'Red Hat Mono', monospace;
      font-size: 11px; border-radius: 3px; text-align: right;
    }
    .prop-value input[type="number"]:focus { border-color: #444; outline: none; }
    .prop-value input[type="checkbox"] { accent-color: #666; }
    .prop-value select {
      background: #111; border: 1px solid #222; color: #ccc;
      padding: 3px 6px; font-family: 'Red Hat Mono', monospace;
      font-size: 11px; border-radius: 3px;
    }
    .prop-value span { color: #555; font-size: 11px; }
    .tag { display: inline-block; padding: 1px 6px; background: #1a1a1a; border-radius: 3px; color: #666; font-size: 10px; margin: 1px; }

    #panel-toggle {
      display: none; position: fixed; bottom: 90px; right: 16px; z-index: 20;
      width: 36px; height: 36px; border-radius: 50%;
      background: none; border: 1px solid #333; color: #666;
      cursor: pointer; font-size: 14px; transition: all 0.2s;
    }
    #panel-toggle:hover { border-color: #666; color: #fff; }
    #panel-toggle.open { color: #fff; border-color: #555; }

    @media (max-width: 768px) {
      #layout { flex-direction: column; }
      #panel {
        position: fixed; top: 0; right: 0; bottom: 0; width: 280px;
        transform: translateX(100%); transition: transform 0.3s;
        z-index: 50; background: #0a0a0a;
      }
      #panel.open { transform: translateX(0); }
      #panel-toggle { display: flex; align-items: center; justify-content: center; }
      #atom-bar { height: 64px; padding: 8px 0; }
      .atom-thumb { height: 40px; }
      #atom-name { bottom: 72px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div id="layout">
    <div id="left">
      <nav><a href="index.html">← Back</a></nav>
      <div id="preview"></div>
      <div id="atom-name">Sticker</div>
      <div id="atom-bar">
        <div class="atom-thumb active" data-atom="sticker" onclick="switchAtom('sticker')"><img src="sticker.png"></div>
        <div class="atom-thumb" data-atom="photo" onclick="switchAtom('photo')"><img src="photo3.png"></div>
        <div class="atom-thumb" data-atom="clip" onclick="switchAtom('clip')" style="width:56px;display:flex;align-items:center;justify-content:center;">
          <svg width="48" height="56" viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="12" width="32" height="38" rx="2" fill="#2a2a2a" transform="rotate(-4 6 12)"/>
            <rect x="9" y="9" width="32" height="38" rx="2" fill="#333" transform="rotate(2 9 9)"/>
            <rect x="8" y="6" width="32" height="38" rx="2" fill="#444" transform="rotate(5 8 6)"/>
            <path d="M28 2 L28 20 Q28 24 24 24 L16 24 Q12 24 12 20 L12 6 Q12 2 16 2 L20 2 Q22 2 22 4 L22 16" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <div class="atom-thumb" data-atom="lure" onclick="switchAtom('lure')" style="width:40px;display:flex;align-items:center;justify-content:center;">
          <svg width="24" height="56" viewBox="0 0 24 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="12" cy="20" rx="8" ry="18" fill="#cc3333"/>
            <ellipse cx="12" cy="20" rx="4" ry="12" fill="#ffcc33" opacity="0.5"/>
            <circle cx="12" cy="6" r="3" stroke="#888" stroke-width="1.5" fill="none"/>
            <line x1="12" y1="38" x2="12" y2="44" stroke="#888" stroke-width="1.5"/>
            <path d="M8 44 Q12 50 12 44 Q12 50 16 44" stroke="#888" stroke-width="1.5" fill="none"/>
          </svg>
        </div>
      </div>
    </div>
    <button id="panel-toggle" onclick="togglePanel()">⚙</button>
    <div id="panel">
      <h2 id="panel-name"><span>Sticker</span><button id="panel-collapse" onclick="collapsePanel()">◀</button></h2>
      <div class="desc" id="panel-desc">粒子化贴纸，支持 morph 变换</div>
      <div id="panel-props"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
  <script>
    let app, currentAtom = 'sticker', sticker = null, atomsConfig = {};

    const atomImages = {
      sticker: { images: ['sticker.png', 'sticker2.png'], type: 'sticker' },
      photo: { images: ['photo_fishing.jpg'], type: 'photo', caption: 'Big catch!', date: "'25 06 15" },
      clip: { images: ['photo1.png', 'photo2.png', 'photo4.png'], type: 'clip' },
      lure: { images: [], type: 'lure' },
    };

    // Load config
    async function loadConfig() {
      const r = await fetch('atoms-config.json');
      atomsConfig = await r.json();
    }

    function renderPanel(name) {
      const cfg = atomsConfig[name];
      if (!cfg) return;
      document.getElementById('panel-name').querySelector('span').textContent = cfg.name;
      document.getElementById('panel-desc').textContent = cfg.description;
      const container = document.getElementById('panel-props');
      container.innerHTML = '';

      function addSection(title, obj, path) {
        const sec = document.createElement('div');
        sec.className = 'prop-section';
        sec.innerHTML = `<div class="prop-section-title">${title}</div>`;
        for (const [key, val] of Object.entries(obj)) {
          const row = document.createElement('div');
          row.className = 'prop-row';
          let valHtml = '';
          if (typeof val === 'boolean') {
            valHtml = `<input type="checkbox" ${val ? 'checked' : ''} onchange="updateProp('${name}','${path}.${key}',this.checked)">`;
          } else if (typeof val === 'number') {
            valHtml = `<input type="number" value="${val}" step="${val < 1 ? 0.01 : val < 10 ? 0.1 : 1}" onchange="updateProp('${name}','${path}.${key}',parseFloat(this.value))">`;
          } else if (typeof val === 'string') {
            valHtml = `<span>${val}</span>`;
          } else if (Array.isArray(val)) {
            valHtml = val.map(v => `<span class="tag">${v}</span>`).join('');
          } else if (val === null) {
            valHtml = `<span>—</span>`;
          } else if (typeof val === 'object') {
            valHtml = `<span>${JSON.stringify(val)}</span>`;
          }
          row.innerHTML = `<span class="prop-label">${key}</span><span class="prop-value">${valHtml}</span>`;
          sec.appendChild(row);
        }
        container.appendChild(sec);
      }

      if (cfg.style) addSection('Style', cfg.style, 'style');
      if (cfg.behavior) addSection('Behavior', cfg.behavior, 'behavior');
      if (cfg.boundary) addSection('Boundary', cfg.boundary, 'boundary');
      if (cfg.combines) {
        const sec = document.createElement('div');
        sec.className = 'prop-section';
        sec.innerHTML = `<div class="prop-section-title">Combines with</div><div>${cfg.combines.map(c=>`<span class="tag">${c}</span>`).join(' ')}</div>`;
        container.appendChild(sec);
      }
    }

    function updateProp(atomName, path, value) {
      const keys = path.split('.');
      let obj = atomsConfig[atomName];
      for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
      obj[keys[keys.length - 1]] = value;
      // Re-render preview with new config
      loadAtom(currentAtom);
      console.log(`Updated ${atomName}.${path} = ${value}`);
    }

    // ─── Rendering (same as before) ───
    function sampleImage(imageData, w, h, gap) {
      const pixels = imageData.data, points = [];
      for (let y = 0; y < h; y += gap) for (let x = 0; x < w; x += gap) {
        const i = (y * w + x) * 4;
        if (pixels[i+3] < 30) continue;
        points.push({ nx:x/w, ny:y/h, r:pixels[i], g:pixels[i+1], b:pixels[i+2], a:pixels[i+3] });
      }
      return points;
    }

    async function loadImagePixels(src) {
      const img = new Image(); img.crossOrigin = "anonymous"; img.src = src;
      await new Promise(r => img.onload = r);
      const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0);
      return { data: ctx.getImageData(0,0,c.width,c.height), w: c.width, h: c.height, tex: PIXI.Texture.from(c) };
    }

    class AtomSticker {
      constructor(imgA, imgB, x, y, scale, cfg) {
        this.posX = x; this.posY = y; this.scale = scale;
        this.renderW = imgA.w*scale; this.renderH = imgA.h*scale;
        this.cfg = cfg || {};
        this.container = new PIXI.Container();
        this.flatSprite = new PIXI.Sprite(imgA.tex);
        this.flatSprite.anchor.set(0.5);
        this.flatSprite.width = this.renderW; this.flatSprite.height = this.renderH;
        this.container.addChild(this.flatSprite);
        this.container.x = x; this.container.y = y;
        this.particles = []; this.activated = false;
        this.state = "idle"; this.hoverProgress = 0;
        this.dragOffsetX = 0; this.dragOffsetY = 0;
        this.morphProgress = 0; this.morphTarget = 0;
        this.morphTimer = null; this.currentForm = 0;
        this.imgDataA = imgA; this.imgDataB = imgB || imgA;
        this.noParticles = !(cfg?.behavior?.hasParticles ?? true);
      }
      get bounds() { return { x:this.posX-this.renderW/2, y:this.posY-this.renderH/2, w:this.renderW, h:this.renderH }; }
      hitTest(mx,my) { const b=this.bounds; return mx>b.x&&mx<b.x+b.w&&my>b.y&&my<b.y+b.h; }
      setHover(h) { if (this.state!=="dragging") this.state=h?"hover":"idle"; }
      startDrag(mx,my) {
        this.activate(); this.state="dragging";
        this.dragOffsetX=this.posX-mx; this.dragOffsetY=this.posY-my; this.hoverProgress=1;
        const interval = this.cfg?.behavior?.morphInterval || 1000;
        if (this.cfg?.behavior?.hasMorph) {
          this.morphTimer = setInterval(() => { this.morphTarget = this.morphTarget===0?1:0; }, interval);
        }
      }
      moveDrag(mx,my) { this.posX=mx+this.dragOffsetX; this.posY=my+this.dragOffsetY; }
      drop() {
        this.state="idle";
        if (this.morphTimer) { clearInterval(this.morphTimer); this.morphTimer=null; }
        this.currentForm = this.morphProgress>0.5?1:0; this.morphTarget=this.currentForm;
      }
      activate() {
        if (this.activated||this.noParticles) return;
        this.activated=true; this.flatSprite.visible=false;
        const gap = this.cfg?.style?.particleGap || 3;
        const pA=sampleImage(this.imgDataA.data,this.imgDataA.w,this.imgDataA.h,gap);
        const pB=sampleImage(this.imgDataB.data,this.imgDataB.w,this.imgDataB.h,gap);
        const mc=Math.max(pA.length,pB.length);
        while(pA.length<mc) pA.push(pA[Math.floor(Math.random()*pA.length)]);
        while(pB.length<mc) pB.push(pB[Math.floor(Math.random()*pB.length)]);
        for(let i=pB.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pB[i],pB[j]]=[pB[j],pB[i]];}
        const ps=this.scale*gap/2*(this.cfg?.style?.particleScale||1);
        const dc=document.createElement("canvas");dc.width=2;dc.height=2;
        const dctx=dc.getContext("2d");dctx.fillStyle="white";dctx.fillRect(0,0,2,2);
        const dt=PIXI.Texture.from(dc);
        const rwB=this.imgDataB.w*this.scale,rhB=this.imgDataB.h*this.scale;
        for(let i=0;i<mc;i++){
          const a=pA[i],b=pB[i];
          const lxA=(a.nx-0.5)*this.renderW,lyA=(a.ny-0.5)*this.renderH;
          const lxB=(b.nx-0.5)*rwB,lyB=(b.ny-0.5)*rhB;
          const sp=new PIXI.Sprite(dt);sp.anchor.set(0.5);sp.scale.set(ps);
          sp.tint=(a.r<<16)|(a.g<<8)|a.b;sp.alpha=a.a/255;
          this.container.addChild(sp);
          this.particles.push({sprite:sp,lxA,lyA,rA:a.r,gA:a.g,bA:a.b,aA:a.a,lxB,lyB,rB:b.r,gB:b.g,bB:b.b,aB:b.a,lx:lxA,ly:lyA,x:this.posX+lxA,y:this.posY+lyA,vx:0,vy:0,nx:a.nx,ny:a.ny,origR:a.r,origG:a.g,origB:a.b,origA:a.a,isFlipped:false});
        }
        this.container.x=0;this.container.y=0;
      }
      update(dt) {
        const hs = this.cfg?.behavior?.hoverScale || 1.05;
        const ts=(this.state==="hover"||this.state==="dragging")?hs:1.0;
        const cs=this.container.scale.x;
        this.container.scale.set(cs+(ts-cs)*0.1);
        if(!this.activated){this.container.x=this.posX;this.container.y=this.posY;if(this.state==="hover")this.activate();if(!this.activated)return;}
        const th=(this.state==="hover"||this.state==="dragging")?1:0;
        this.hoverProgress+=(th-this.hoverProgress)*0.1;
        this.morphProgress+=(this.morphTarget-this.morphProgress)*0.05;
        const damping = this.cfg?.behavior?.springDamping || 0.7;
        const stiffness = this.cfg?.behavior?.springStiffness || 0.15;
        const expandFactor = this.cfg?.behavior?.expandOnHover || 12;
        const doPeel = this.cfg?.behavior?.cornerPeel !== false;
        for(const p of this.particles){
          const m=this.morphProgress;
          const clx=p.lxA+(p.lxB-p.lxA)*m,cly=p.lyA+(p.lyB-p.lyA)*m;
          const cr=Math.round(p.rA+(p.rB-p.rA)*m),cg=Math.round(p.gA+(p.gB-p.gA)*m),cb=Math.round(p.bA+(p.bB-p.bA)*m);
          p.lx=clx;p.ly=cly;p.nx=clx/this.renderW+0.5;p.ny=cly/this.renderH+0.5;
          let tx=this.posX+clx,ty=this.posY+cly;
          if(doPeel){const fr=0.6,dc2=Math.sqrt((1-p.nx)**2+(1-p.ny)**2);if(dc2<fr){const fa=(fr-dc2)/fr,hp=this.hoverProgress;tx-=2*(1-p.nx)*fa*hp*this.renderW*0.3;ty-=2*(1-p.ny)*fa*hp*this.renderH*0.3;}}
          if(this.hoverProgress>0.01&&expandFactor>0){tx+=(p.nx-0.5)*expandFactor*this.hoverProgress;ty+=(p.ny-0.5)*expandFactor*this.hoverProgress;}
          p.vx+=(tx-p.x)*stiffness;p.vy+=(ty-p.y)*stiffness;
          p.vx*=damping;p.vy*=damping;
          p.x+=p.vx;p.y+=p.vy;
          p.sprite.x=p.x;p.sprite.y=p.y;
          p.sprite.tint=(cr<<16)|(cg<<8)|cb;
          p.sprite.alpha=(p.aA+(p.aB-p.aA)*m)/255;
        }
      }
    }

    let extraContainers = [];
    async function loadAtom(name) {
      if(sticker){app.stage.removeChild(sticker.container);sticker=null;}
      extraContainers.forEach(c=>app.stage.removeChild(c));extraContainers=[];
      const imgCfg = atomImages[name];
      const cfg = atomsConfig[name];
      const W=app.screen.width, H=app.screen.height;

      if(imgCfg.type==='lure'){
        const group=new PIXI.Container();
        const W2=app.screen.width,H2=app.screen.height;
        group.x=W2/2;group.y=H2/2-20;
        const bw=cfg?.style?.bodyWidth||28,bh=cfg?.style?.bodyHeight||80;
        const sc=Math.min(W2*0.15/bw, H2*0.3/bh);
        // Ring at top
        const ring=new PIXI.Graphics();
        ring.circle(0,-bh*sc/2-8*sc,5*sc);
        ring.setStrokeStyle({width:2*sc,color:0x888888});ring.stroke();
        group.addChild(ring);
        // Body
        const body=new PIXI.Graphics();
        body.ellipse(0,0,bw*sc/2,bh*sc/2);
        body.fill(parseInt((cfg?.style?.bodyColor||'#cc3333').replace('#',''),16));
        group.addChild(body);
        // Accent stripe
        const accent=new PIXI.Graphics();
        accent.ellipse(0,0,bw*sc/4,bh*sc/3);
        accent.fill({color:parseInt((cfg?.style?.bodyAccent||'#ffcc33').replace('#',''),16),alpha:0.5});
        group.addChild(accent);
        // Eye
        const eye=new PIXI.Graphics();
        eye.circle(bw*sc/5,-bh*sc/5,3*sc);
        eye.fill(0xffffff);eye.circle(bw*sc/5,-bh*sc/5,1.5*sc);eye.fill(0x000000);
        group.addChild(eye);
        // Hook stem
        const hook=new PIXI.Graphics();
        hook.setStrokeStyle({width:2*sc,color:parseInt((cfg?.style?.hookColor||'#888888').replace('#',''),16),cap:'round'});
        hook.moveTo(0,bh*sc/2);hook.lineTo(0,bh*sc/2+15*sc);
        // Treble hook
        hook.moveTo(-6*sc,bh*sc/2+15*sc);hook.quadraticCurveTo(-8*sc,bh*sc/2+25*sc,0,bh*sc/2+15*sc);
        hook.moveTo(6*sc,bh*sc/2+15*sc);hook.quadraticCurveTo(8*sc,bh*sc/2+25*sc,0,bh*sc/2+15*sc);
        hook.moveTo(0,bh*sc/2+15*sc);hook.quadraticCurveTo(0,bh*sc/2+26*sc,-3*sc,bh*sc/2+20*sc);
        hook.stroke();
        group.addChild(hook);
        app.stage.addChild(group);extraContainers.push(group);
        // Draggable
        let lureDrag=false,lureOffX=0,lureOffY=0;
        const lureHit=(mx,my)=>{const r=bh*sc;return Math.abs(mx-group.x)<bw*sc&&Math.abs(my-group.y)<r;};
        app.canvas.addEventListener('mousedown',e=>{if(lureHit(e.clientX,e.clientY)){lureDrag=true;lureOffX=group.x-e.clientX;lureOffY=group.y-e.clientY;}});
        app.canvas.addEventListener('mousemove',e=>{if(lureDrag){group.x=e.clientX+lureOffX;group.y=e.clientY+lureOffY;}});
        app.canvas.addEventListener('mouseup',()=>{lureDrag=false;});
        return;
      }
      if(imgCfg.type==='clip'){
        const group=new PIXI.Container();
        const W2=app.screen.width,H2=app.screen.height;
        group.x=W2/2;group.y=H2/2-20;
        const imgs=[];for(const src of imgCfg.images)imgs.push(await loadImagePixels(src));
        const maxW=W2*0.22,maxH=H2*0.32;
        // Photos stacked, left-top aligned, slight random rotation
        for(let i=0;i<imgs.length;i++){
          const img=imgs[i];const sc=Math.min(maxW/img.w,maxH/img.h);
          const rot=(Math.random()*8-4)*Math.PI/180;
          const offX=i*4, offY=i*6;
          // Shadow
          const sh=new PIXI.Graphics();
          sh.roundRect(2,2,img.w*sc,img.h*sc,2);
          sh.fill({color:0,alpha:0.1});
          sh.x=-maxW/2+offX;sh.y=-maxH/2+offY;sh.rotation=rot;
          group.addChild(sh);
          // Photo
          const sp=new PIXI.Sprite(img.tex);
          sp.width=img.w*sc;sp.height=img.h*sc;
          sp.x=-maxW/2+offX;sp.y=-maxH/2+offY;sp.rotation=rot;
          group.addChild(sp);
        }
        // Paper clip SVG on top-left, protruding above photos
        const clipTex=await PIXI.Assets.load({src:'paperclip.svg',data:{resolution:4}});
        const clipSp=new PIXI.Sprite(clipTex);
        const clipScale=Math.min(maxW*0.25/clipSp.texture.width, maxH*0.55/clipSp.texture.height);
        clipSp.scale.set(clipScale);
        clipSp.x=-maxW/2+8;
        clipSp.y=-maxH/2-clipSp.texture.height*clipScale*0.25;
        group.addChild(clipSp);

        app.stage.addChild(group);extraContainers.push(group);
        // Draggable
        let clipDrag=false,clipOffX=0,clipOffY=0;
        const clipHit=(mx,my)=>{return Math.abs(mx-group.x)<maxW*0.7&&Math.abs(my-group.y)<maxH*0.7;};
        app.canvas.addEventListener('mousedown',e=>{if(clipHit(e.clientX,e.clientY)){clipDrag=true;clipOffX=group.x-e.clientX;clipOffY=group.y-e.clientY;}});
        app.canvas.addEventListener('mousemove',e=>{if(clipDrag){group.x=e.clientX+clipOffX;group.y=e.clientY+clipOffY;}});
        app.canvas.addEventListener('mouseup',()=>{clipDrag=false;});
        return;
      }

      const imgA=await loadImagePixels(imgCfg.images[0]);
      const imgB=imgCfg.images[1]?await loadImagePixels(imgCfg.images[1]):imgA;
      const maxW2=W*0.4,maxH2=H*0.5;
      const scale=Math.min(maxW2/imgA.w,maxH2/imgA.h);

      if(imgCfg.type==='photo'){
        // Polaroid style
        const group=new PIXI.Container();
        const W2=app.screen.width,H2=app.screen.height;
        group.x=W2/2;group.y=H2/2-20;
        const pw=imgA.w*scale, ph=imgA.h*scale;
        const border=pw*0.06;
        const bottomBorder=border*3;
        // White frame
        const frame=new PIXI.Graphics();
        frame.roundRect(-pw/2-border,-ph/2-border,pw+border*2,ph+border+bottomBorder,3);
        frame.fill(0xf5f5f0);
        group.addChild(frame);
        // Shadow under frame
        const shadow=new PIXI.Graphics();
        shadow.roundRect(-pw/2-border+3,-ph/2-border+3,pw+border*2,ph+border+bottomBorder,3);
        shadow.fill({color:0x000000,alpha:0.12});
        group.addChildAt(shadow,0);
        // Photo
        const sp=new PIXI.Sprite(imgA.tex);
        sp.anchor.set(0.5,0);
        sp.width=pw;sp.height=ph;
        sp.y=-ph/2;
        group.addChild(sp);
        // Caption text (hand-written style)
        const caption=imgCfg.caption||'';
        const date=imgCfg.date||'';
        const textRot=(Math.random()*8-4)*Math.PI/180;
        if(caption){
          const capText=new PIXI.Text({text:caption,style:{fontFamily:'Schoolbell',fontSize:Math.max(28,pw*0.12),fill:0x333333}});
          capText.x=-pw/2+border*(0.3+Math.random()*0.5);
          capText.y=ph/2-bottomBorder/2+border*(0.2+Math.random()*0.6)-border*0.5;
          capText.rotation=textRot;
          group.addChild(capText);
        }
        if(date){
          const dateText=new PIXI.Text({text:date,style:{fontFamily:'Schoolbell',fontSize:Math.max(24,pw*0.10),fill:0x555555}});
          dateText.anchor.set(1,0);
          dateText.x=pw/2-border*(0.2+Math.random()*0.4);
          dateText.y=ph/2-bottomBorder/2+border*(0.4+Math.random()*0.8)-border*0.3;
          dateText.rotation=textRot;
          group.addChild(dateText);
        }
        app.stage.addChild(group);extraContainers.push(group);
        // Draggable
        let photoDrag=false,photoOffX=0,photoOffY=0;
        const photoHit=(mx,my)=>Math.abs(mx-group.x)<pw*0.6&&Math.abs(my-group.y)<(ph+bottomBorder)*0.6;
        app.canvas.addEventListener('mousedown',e=>{if(photoHit(e.clientX,e.clientY)){photoDrag=true;photoOffX=group.x-e.clientX;photoOffY=group.y-e.clientY;}});
        app.canvas.addEventListener('mousemove',e=>{if(photoDrag){group.x=e.clientX+photoOffX;group.y=e.clientY+photoOffY;}});
        app.canvas.addEventListener('mouseup',()=>{photoDrag=false;});
        return;
      }

      sticker=new AtomSticker(imgA,imgB,W/2,H/2-30,scale,cfg);
      app.stage.addChild(sticker.container);
    }

    function switchAtom(name) {
      currentAtom=name;
      document.querySelectorAll('.atom-thumb').forEach(el=>el.classList.toggle('active',el.dataset.atom===name));
      document.getElementById('atom-name').textContent=name.charAt(0).toUpperCase()+name.slice(1);
      renderPanel(name);
      loadAtom(name);
    }

    async function init() {
      await loadConfig();
      const preview=document.getElementById('preview');
      const W=preview.clientWidth,H=preview.clientHeight;
      app=new PIXI.Application();
      await app.init({width:W,height:H,resolution:window.devicePixelRatio||1,autoDensity:true,backgroundColor:0x0a0a0a});
      preview.appendChild(app.canvas);

      const mouse={x:-9999,y:-9999};let dragged=null;
      app.canvas.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(dragged)dragged.moveDrag(mouse.x,mouse.y);else if(sticker)sticker.setHover(sticker.hitTest(mouse.x,mouse.y));});
      app.canvas.addEventListener("mousedown",e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(sticker&&sticker.hitTest(mouse.x,mouse.y)){sticker.startDrag(mouse.x,mouse.y);dragged=sticker;}});
      app.canvas.addEventListener("mouseup",()=>{if(dragged){dragged.drop();dragged=null;}});

      let longPress=null,touchMoved=false;
      window.addEventListener("touchstart",e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;touchMoved=false;longPress=setTimeout(()=>{if(!touchMoved&&sticker&&sticker.hitTest(mouse.x,mouse.y)){sticker.startDrag(mouse.x,mouse.y);dragged=sticker;}},400);});
      window.addEventListener("touchmove",e=>{if(dragged)e.preventDefault();const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;touchMoved=true;if(longPress){clearTimeout(longPress);longPress=null;}if(dragged)dragged.moveDrag(mouse.x,mouse.y);},{passive:false});
      window.addEventListener("touchend",()=>{if(longPress){clearTimeout(longPress);longPress=null;}if(dragged){dragged.drop();dragged=null;}});

      app.ticker.add(ticker=>{const dt=Math.min(ticker.deltaMS/1000,0.05);if(sticker)sticker.update(dt);});

      renderPanel(currentAtom);
      await loadAtom(currentAtom);
    }
    function collapsePanel() {
      const p = document.getElementById("panel");
      const btn = document.getElementById("panel-collapse");
      p.classList.toggle("collapsed");
      btn.textContent = p.classList.contains("collapsed") ? "▶" : "◀";
    }
    function togglePanel() {
      const p = document.getElementById("panel");
      const b = document.getElementById("panel-toggle");
      p.classList.toggle("open");
      b.classList.toggle("open");
      b.textContent = p.classList.contains("open") ? "✕" : "⚙";
    }
    init();
  </script>
</body>
</html>
