<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wall — Jesse Lai</title>
  <style>
    @font-face {
      font-family: 'Bradford LL';
      src: url('fonts/BradfordLL-Regular.woff2') format('woff2'),
           url('fonts/BradfordLL-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Bradford LL';
      src: url('fonts/BradfordLL-Italic.woff2') format('woff2'),
           url('fonts/BradfordLL-Italic.otf') format('opentype');
      font-weight: 400;
      font-style: italic;
    }
    @font-face {
      font-family: 'Bradford LL';
      src: url('fonts/BradfordLL-SemiBold.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Red Hat Mono';
      src: url('fonts/RedHatMono-Regular.woff2') format('woff2'),
           url('fonts/RedHatMono-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Red Hat Mono';
      src: url('fonts/RedHatMono-Medium.woff2') format('woff2'),
           url('fonts/RedHatMono-Medium.ttf') format('truetype');
      font-weight: 500;
    }
    * { margin: 0; padding: 0; }
    body { background: #f5f2ed; overflow-x: hidden; }
    canvas { display: block; touch-action: pan-y !important; }
    #theme-toggle {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      width: 40px; height: 40px; border-radius: 50%;
      border: 2px solid #333; background: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: all 0.3s; user-select: none;
    }
    body.dark #theme-toggle { border-color: #aaa; background: #222; }
  </style>
</head>
<body>
  <div id="theme-toggle" onclick="toggleTheme()">☀️</div>
  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      document.getElementById('theme-toggle').textContent = isDark ? '🌙' : '☀️';
      window.dispatchEvent(new CustomEvent('themechange', { detail: { dark: isDark } }));
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@chenglou/pretext": "https://esm.sh/@chenglou/pretext@0.0.6"
      }
    }
  </script>
  <script type="module" src="wall.js"></script>
</body>
</html>
