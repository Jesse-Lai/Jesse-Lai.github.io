<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wall — Jesse Lai</title>
  <link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Red Hat Mono';
      src: url('fonts/RedHatMono-Regular.woff2') format('woff2');
      font-weight: 400;
    }
    * { margin: 0; padding: 0; }
    html, body { background: #0a0a0a; overflow-x: hidden; }
    body { min-height: 100vh; }
    canvas { display: block; }
    /* Loading screen */
    #loading-screen {
      position: fixed; inset: 0; z-index: 99999;
      background: #0a0a0a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.6s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-text {
      font-family: 'Red Hat Mono', 'Courier New', monospace;
      color: #666; font-size: 13px; letter-spacing: 2px;
      margin-bottom: 20px;
    }
    #loading-bar-bg {
      width: 200px; height: 2px;
      background: rgba(255,255,255,0.08); border-radius: 1px;
      overflow: hidden;
    }
    #loading-bar {
      height: 100%; width: 0%; border-radius: 1px;
      background: rgba(255,255,255,0.5);
      transition: width 0.3s ease;
    }
    #loading-percent {
      font-family: 'Red Hat Mono', 'Courier New', monospace;
      color: #444; font-size: 11px; margin-top: 10px;
    }
    #atoms-btn {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      padding: 8px 0; background: none; border: none;
      color: #666; cursor: pointer; font-size: 13px;
      font-family: 'Red Hat Mono', monospace; letter-spacing: 1px;
      transition: color 0.2s; user-select: none;
    }
    #atoms-btn:hover { color: #fff; }

    /* Focus overlay */
    canvas.focus-active {
      filter: blur(6px) brightness(0.3);
      transition: filter 0.4s ease;
    }
    canvas { transition: filter 0.4s ease; }
    #focus-overlay {
      position: fixed; inset: 0; z-index: 10000;
      display: none;
      pointer-events: none;
    }
    #focus-overlay.visible { pointer-events: auto; }
    #focus-overlay.visible ~ #atoms-btn,
    body:has(#focus-overlay.visible) #atoms-btn { display: none; }
    #focus-backdrop {
      position: absolute; inset: 0;
      cursor: pointer;
    }
    #focus-content {
      position: absolute; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 24px;
      pointer-events: none;
      transform: translateY(20px);
      opacity: 0;
      transition: opacity 0.3s ease 0.15s, transform 0.3s ease 0.15s;
    }
    #focus-overlay.visible #focus-content {
      transform: translateY(0); opacity: 1;
    }
    #focus-title {
      font-family: 'Red Hat Mono', monospace;
      font-size: 15px; color: #fff; letter-spacing: 1px;
      margin-bottom: 6px;
    }
    #focus-desc {
      font-family: 'Red Hat Mono', monospace;
      font-size: 12px; color: #999; line-height: 1.6;
      max-width: 400px; text-align: center;
      margin-bottom: 16px;
    }
    #focus-link {
      pointer-events: auto;
      font-family: 'Red Hat Mono', monospace;
      font-size: 12px; color: #0a0a0a; background: #fff;
      padding: 8px 20px; border-radius: 4px;
      text-decoration: none; letter-spacing: 1px;
      transition: background 0.2s, color 0.2s;
    }
    #focus-link:hover { background: #ddd; }
    #focus-close {
      position: absolute; top: 20px; right: 20px;
      pointer-events: auto;
      background: none; border: 1px solid #555;
      color: #999; width: 36px; height: 36px;
      border-radius: 50%; cursor: pointer;
      font-size: 16px; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    #focus-close:hover { border-color: #fff; color: #fff; }

    /* Article mode — article content lives INSIDE the focus overlay */
    #focus-overlay.article-mode {
      overflow-y: auto;
    }
    #focus-overlay.article-mode #focus-content {
      display: none;
    }
    #focus-overlay.article-mode #focus-backdrop {
      position: sticky; top: 0; height: 0;
    }
    #focus-overlay.article-mode #focus-close {
      position: fixed;
    }
    #focus-article {
      display: none;
      max-width: 640px; margin: 0 auto;
      padding: 0 24px 100px;
      opacity: 0; transform: translateY(30px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #focus-overlay.article-mode #focus-article {
      display: block;
    }
    #focus-overlay.article-mode #focus-article.visible {
      opacity: 1; transform: translateY(0);
    }
    #focus-article .article-title {
      font-family: 'Special Elite', cursive;
      font-size: 28px; color: #f0f0f0; letter-spacing: 0.5px;
      margin-bottom: 32px; line-height: 1.4;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    #focus-article .article-subtitle {
      font-family: 'Special Elite', cursive;
      font-size: 20px; color: #e0e0e0; letter-spacing: 0.3px;
      margin: 48px 0 16px; line-height: 1.4;
    }
    #focus-article .article-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      font-size: 16px; color: #a0a0a0; line-height: 1.85;
      margin-bottom: 24px; letter-spacing: 0.01em;
    }
    #focus-article .article-img {
      width: 100%; border-radius: 6px;
      margin: 32px 0 8px;
    }
    #focus-article .article-caption {
      font-family: 'Red Hat Mono', monospace;
      font-size: 11px; color: #555; text-align: center;
      margin: 0 0 32px; letter-spacing: 0.5px;
    }
    /* Article chat */
    .article-chat { margin-top: 48px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 32px; }
    .chat-msg { margin-bottom: 32px; }
    .chat-msg.user { text-align: right; }
    .chat-msg.user .chat-bubble {
      font-family: 'Special Elite', cursive;
      font-size: 28px; color: #f0f0f0; letter-spacing: 0.5px;
      line-height: 1.4;
    }
    .chat-msg.ai .chat-bubble { color: #a0a0a0; }
    .chat-msg.ai .chat-bubble h2 {
      font-family: 'Special Elite', cursive;
      font-size: 20px; color: #e0e0e0; margin: 48px 0 16px; line-height: 1.4;
    }
    .chat-msg.ai .chat-bubble h2:first-child { margin-top: 0; }
    .chat-msg.ai .chat-bubble p {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px; color: #a0a0a0; line-height: 1.85; margin-bottom: 24px;
    }
    .chat-msg.ai .chat-bubble p:last-child { margin-bottom: 0; }
    .chat-msg.ai .chat-bubble img {
      width: 100%; border-radius: 6px; margin: 32px 0 8px;
    }
    .chat-msg.ai .chat-bubble .img-caption {
      font-family: 'Red Hat Mono', monospace;
      font-size: 11px; color: #555; text-align: center; margin: 0 0 32px;
    }

    /* Atom entry (rendered via PIXI extract) */
    .atom-entry {
      display: flex; justify-content: center;
      margin: 16px 0; cursor: pointer;
      transition: transform 0.2s;
    }
    .atom-entry:hover { transform: scale(1.05); }
    /* Shared composer bar */
    .composer-bar {
      position: fixed; bottom: 24px; left: 0; right: 0;
      padding: 0 24px; pointer-events: none;
    }
    .composer-bar .composer-box {
      pointer-events: auto;
      flex: 1; max-width: 640px; margin: 0 auto; box-sizing: border-box;
      display: flex; align-items: center; gap: 8px;
      background: rgba(30,30,30,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: border-color 0.2s;
    }
    .composer-bar .composer-box:focus-within { border-color: rgba(255,255,255,0.25); }
    .composer-bar textarea {
      flex: 1; resize: none; border: none; background: none; outline: none;
      color: #e0e0e0; font-size: 15px; line-height: 1.5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-height: 120px; min-height: 22px; padding: 0;
    }
    .composer-bar textarea::placeholder { color: rgba(255,255,255,0.3); }
    .composer-bar .send-btn {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      background: #fff; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s;
    }
    .composer-bar .send-btn:disabled { opacity: 0.2; cursor: default; }
    .composer-bar .send-btn svg { width: 14px; height: 14px; }
    /* Per-composer overrides */
    #article-composer { z-index: 10001; display: none; }
    #wall-composer { z-index: 9998; }
    /* Nested focus overlay (on top of article) */
    #nested-overlay {
      position: fixed; inset: 0; z-index: 10003;
      display: none; pointer-events: none;
    }
    #nested-overlay.visible { pointer-events: auto; }
    #nested-overlay #nested-content {
      position: absolute; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 24px; pointer-events: none;
      transform: translateY(20px); opacity: 0;
      transition: opacity 0.3s ease 0.15s, transform 0.3s ease 0.15s;
    }
    #nested-overlay.visible #nested-content {
      transform: translateY(0); opacity: 1;
    }
    #nested-title {
      font-family: 'Red Hat Mono', monospace;
      font-size: 15px; color: #fff; letter-spacing: 1px; margin-bottom: 6px;
    }
    #nested-desc {
      font-family: 'Red Hat Mono', monospace;
      font-size: 12px; color: #999; line-height: 1.6;
      max-width: 400px; text-align: center; margin-bottom: 16px;
    }
    #nested-link {
      pointer-events: auto;
      font-family: 'Red Hat Mono', monospace;
      font-size: 12px; color: #0a0a0a; background: #fff;
      padding: 8px 20px; border-radius: 4px;
      text-decoration: none; letter-spacing: 1px;
      transition: background 0.2s, color 0.2s;
    }
    #nested-link:hover { background: #ddd; }
    #nested-close {
      position: absolute; top: 20px; right: 20px; z-index: 10004;
      pointer-events: auto;
      background: none; border: 1px solid #555;
      color: #999; width: 36px; height: 36px;
      border-radius: 50%; cursor: pointer;
      font-size: 16px; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    #nested-close:hover { border-color: #fff; color: #fff; }

    /* ─── Composer Row (button + input) ─── */
    .composer-row {
      pointer-events: auto;
      max-width: 700px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
    }
    #organize-btn {
      pointer-events: auto; flex-shrink: 0;
      width: 48px; height: 48px;
      background: rgba(30,30,30,0.7);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      padding: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #organize-btn:hover, #shuffle-btn:hover { color: #fff; border-color: rgba(255,255,255,0.25); }
    #organize-btn svg, #shuffle-btn svg { width: 18px; height: 18px; }
    #shuffle-btn {
      pointer-events: auto; flex-shrink: 0;
      width: 48px; height: 48px;
      background: rgba(30,30,30,0.7);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      padding: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* ─── Language Toggle ─── */
    #lang-toggle {
      position: fixed; top: 16px; right: 70px; z-index: 9999;
      background: none; border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.6); font-family: 'Red Hat Mono', monospace;
      font-size: 12px; letter-spacing: 1px; padding: 6px 14px;
      border-radius: 4px; cursor: pointer; transition: all 0.2s;
    }
    #lang-toggle:hover { border-color: #fff; color: #fff; }

    /* ─── Wall Article ─── */
    #wall-article {
      position: fixed; inset: 0; z-index: 9999;
      overflow-y: auto; background: #0a0a0a;
      display: none; opacity: 0;
      transition: opacity 0.4s ease;
    }
    #wall-article.visible { opacity: 1; }
    #wall-article-content {
      max-width: 640px; margin: 0 auto;
      padding: 80px 24px 160px;
    }
    #wall-article-close {
      position: fixed; top: 20px; right: 20px; z-index: 10000;
      background: none; border: 1px solid #555;
      color: #999; width: 36px; height: 36px;
      border-radius: 50%; cursor: pointer;
      font-size: 16px; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    #wall-article-close:hover { border-color: #fff; color: #fff; }

    /* Canvas fade transition */
    canvas { transition: opacity 0.5s ease, transform 0.5s ease; }
    canvas.faded { opacity: 0; transform: scale(0.95); pointer-events: none; }
  </style>
</head>
<body>
  <button id="lang-toggle"></button>
  <script>
    const lang = localStorage.getItem('wall-lang') || 'en';
    const btn = document.getElementById('lang-toggle');
    btn.textContent = lang === 'en' ? '中文' : 'EN';
    btn.onclick = () => { localStorage.setItem('wall-lang', lang === 'en' ? 'zh' : 'en'); location.reload(); };
  </script>
  <div id="atoms-btn" style="display:none" onclick="location.href='atoms.html'">Atoms</div>
  <script>if(location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.search.includes('dev'))document.getElementById('atoms-btn').style.display='';</script>
  <div id="focus-overlay">
    <div id="focus-backdrop"></div>
    <button id="focus-close"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m4.397 4.554.073-.084a.75.75 0 0 1 .976-.073l.084.073L12 10.939l6.47-6.47a.75.75 0 1 1 1.06 1.061L13.061 12l6.47 6.47a.75.75 0 0 1 .072.976l-.073.084a.75.75 0 0 1-.976.073l-.084-.073L12 13.061l-6.47 6.47a.75.75 0 0 1-1.06-1.061L10.939 12l-6.47-6.47a.75.75 0 0 1-.072-.976l.073-.084-.073.084Z" fill="currentColor"/></svg></button>

    </div>

      <div class="composer-box">

        </button>
      </div>
    </div>
  </div>
  <div id="nested-overlay">
    <button id="nested-close"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m4.397 4.554.073-.084a.75.75 0 0 1 .976-.073l.084.073L12 10.939l6.47-6.47a.75.75 0 1 1 1.06 1.061L13.061 12l6.47 6.47a.75.75 0 0 1 .072.976l-.073.084a.75.75 0 0 1-.976.073l-.084-.073L12 13.061l-6.47 6.47a.75.75 0 0 1-1.06-1.061L10.939 12l-6.47-6.47a.75.75 0 0 1-.072-.976l.073-.084-.073.084Z" fill="currentColor"/></svg></button>
    <div id="nested-content">
      <div id="nested-title"></div>
      <div id="nested-desc"></div>
      <a id="nested-link" href="#">View story</a>
    </div>
  </div>
  <div id="wall-composer" class="composer-bar">
    <div class="composer-row">
      <button id="organize-btn" title="Organize">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 4l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      </button>
      <div class="composer-box">
        <textarea rows="1" placeholder="Ask Jesse anything..."></textarea>
      <button class="send-btn" disabled>
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4.284 10.296A1 1 0 0 0 5.709 11.7L11 6.33V20a1 1 0 1 0 2 0V6.336l5.285 5.364a1 1 0 0 0 1.425-1.404l-6.823-6.924a1.25 1.25 0 0 0-1.78 0l-6.823 6.924Z" fill="#0a0a0a"/></svg>
      </button>
    </div>
    </div>
  </div>
  <div id="wall-article">
    <button id="wall-article-close"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m4.397 4.554.073-.084a.75.75 0 0 1 .976-.073l.084.073L12 10.939l6.47-6.47a.75.75 0 1 1 1.06 1.061L13.061 12l6.47 6.47a.75.75 0 0 1 .072.976l-.073.084a.75.75 0 0 1-.976.073l-.084-.073L12 13.061l-6.47 6.47a.75.75 0 0 1-1.06-1.061L10.939 12l-6.47-6.47a.75.75 0 0 1-.072-.976l.073-.084-.073.084Z" fill="currentColor"/></svg></button>
    <div id="wall-article-content"></div>
  </div>
  <!-- Loading screen -->
  <div id="loading-screen">
    <div id="loading-text">THE WALL</div>
    <div id="loading-bar-bg"><div id="loading-bar"></div></div>
    <div id="loading-percent">0%</div>
  </div>
  <script>
  window.onerror = function(msg, src, line, col, err) {
    document.getElementById('loading-text').textContent = 'ERROR';
    document.getElementById('loading-percent').textContent = msg + ' @ ' + src + ':' + line;
    document.getElementById('loading-percent').style.fontSize = '9px';
    document.getElementById('loading-percent').style.maxWidth = '90vw';
    document.getElementById('loading-percent').style.wordBreak = 'break-all';
  };
  window.addEventListener('unhandledrejection', function(e) {
    document.getElementById('loading-text').textContent = 'ERROR';
    document.getElementById('loading-percent').textContent = String(e.reason);
    document.getElementById('loading-percent').style.fontSize = '9px';
    document.getElementById('loading-percent').style.maxWidth = '90vw';
    document.getElementById('loading-percent').style.wordBreak = 'break-all';
  });
  </script>
  <script src="lib/pixi.min.js"></script>
  <script type="module" src="wall.js?v=166"></script>
</body>
</html>
