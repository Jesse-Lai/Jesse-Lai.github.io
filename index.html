<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wall — Jesse Lai</title>
  <style>
    @font-face {
      font-family: 'Bradford LL';
      src: url('fonts/BradfordLL-Regular.woff2') format('woff2'),
           url('fonts/BradfordLL-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Bradford LL';
      src: url('fonts/BradfordLL-Italic.woff2') format('woff2'),
           url('fonts/BradfordLL-Italic.otf') format('opentype');
      font-weight: 400;
      font-style: italic;
    }
    @font-face {
      font-family: 'Bradford LL';
      src: url('fonts/BradfordLL-SemiBold.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Red Hat Mono';
      src: url('fonts/RedHatMono-Regular.woff2') format('woff2'),
           url('fonts/RedHatMono-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Red Hat Mono';
      src: url('fonts/RedHatMono-Medium.woff2') format('woff2'),
           url('fonts/RedHatMono-Medium.ttf') format('truetype');
      font-weight: 500;
    }
    * { margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; touch-action: pan-y !important; }
    #atoms-btn {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      padding: 8px 0; background: none; border: none;
      color: #666; cursor: pointer; font-size: 13px;
      font-family: 'Red Hat Mono', monospace; letter-spacing: 1px;
      transition: color 0.2s; user-select: none;
    }
    #atoms-btn:hover { color: #fff; }
  </style>
</head>
<body>
  <div id="atoms-btn" onclick="location.href='atoms.html'">⚛ Atoms</div>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@chenglou/pretext": "https://esm.sh/@chenglou/pretext@0.0.6"
      }
    }
  </script>
  <script type="module" src="wall.js"></script>
</body>
</html>
