    #figma-reasoning-detail .detail-card {
      width: min(100%, 680px);
      padding: 30px 36px 34px;
      border-radius: 24px;
      corner-shape: squircle;
      background: #ffffff;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
    }

    #figma-reasoning-detail .detail-stage {
      width: 100%;
      min-height: 228px;
      padding: 4px 0 20px;
      background: #ffffff;
    }

    #figma-reasoning-detail .detail-label {
      display: flex;
      align-items: center;
      height: 26px;
      margin: 0;
      color: #b0b0b0;
      font-size: 20px;
      font-weight: 400;
      line-height: 16px;
    }

    #figma-reasoning-detail .detail-slider-slot {
      position: relative;
      width: 297px;
      height: 41px;
      margin-top: 9px;
    }

    #figma-reasoning-detail .detail-slider-visual {
      position: absolute;
      top: -4px;
      left: 0;
      width: 297px;
      height: 49px;
      pointer-events: none;
    }

    #figma-reasoning-detail .detail-track {
      position: absolute;
      top: 7.75px;
      left: 0.25px;
      width: 296.5px;
      height: 34.5px;
      border: 0.5px solid #d8d8d8;
      border-radius: 17.25px;
      background: #e9e9e9;
    }

    #figma-reasoning-detail .detail-fill {
      position: absolute;
      top: 7.5px;
      left: 0;
      width: 166px;
      height: 35px;
      border-radius: 17.5px;
      background: #349cff;
      transition: width 120ms ease, left 120ms ease;
    }

    #figma-reasoning-detail .detail-dot {
      position: absolute;
      top: 22.5px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #b5b6b7;
      transform: translateX(-50%);
    }

    #figma-reasoning-detail .detail-dot-one { left: 21px; background: rgba(255, 255, 255, 0.4); }
    #figma-reasoning-detail .detail-dot-two { left: 149px; }
    #figma-reasoning-detail .detail-dot-three { left: 277px; }

    #figma-reasoning-detail .detail-thumb {
      position: absolute;
      top: 4px;
      left: 128px;
      width: 41px;
      height: 41px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.12);
      transition: left 120ms ease;
    }

    #figma-reasoning-detail .detail-range {
      position: absolute;
      top: -4px;
      left: 0;
      z-index: 2;
      width: 297px;
      height: 49px;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    #figma-reasoning-detail .detail-range:focus-visible + .detail-focus {
      opacity: 1;
    }

    #figma-reasoning-detail .detail-focus {
      position: absolute;
      top: -1px;
      left: -5px;
      width: 307px;
      height: 43px;
      border: 2px solid rgba(52, 156, 255, 0.35);
      border-radius: 22px;
      opacity: 0;
      pointer-events: none;
    }

    #figma-reasoning-detail .detail-copy {
      width: 100%;
      min-height: 96px;
      margin: 32px 0 0;
      color: #555555;
      font-size: 20px;
      font-weight: 400;
      line-height: 32px;
      overflow-wrap: break-word;
    }

    #figma-reasoning-detail .detail-character {
      display: inline-block;
      opacity: 0;
      filter: blur(2px);
      transform: translateY(3px);
      animation: detail-character-reveal 220ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes detail-character-reveal {
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    #figma-reasoning-detail .detail-highlight {
      display: inline-block;
      height: 26px;
      margin: 0 1px;
      padding: 0 6px;
      border-radius: 8px;
      background: #e5e5e5;
      line-height: 26px;
      vertical-align: baseline;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    #figma-reasoning-detail .detail-highlight.detail-tag-reveal {
      opacity: 0;
      filter: blur(2px);
      transform: translateY(3px);
      animation: detail-character-reveal 220ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    #figma-reasoning-detail.level-one .detail-fill { left: 0; width: 38px; }
    #figma-reasoning-detail.level-one .detail-dot-one { left: 21px; }
    #figma-reasoning-detail.level-one .detail-dot-two { left: 149px; background: #b5b6b7; }
    #figma-reasoning-detail.level-one .detail-dot-three { left: 277px; }
    #figma-reasoning-detail.level-one .detail-thumb { left: 0; }

    #figma-reasoning-detail.level-two .detail-thumb { left: 128px; }
    #figma-reasoning-detail.level-three .detail-fill { width: 297px; }
    #figma-reasoning-detail.level-three .detail-thumb { left: 256px; }

    @media (max-width: 600px) {
      #figma-reasoning-detail .detail-page {
        min-height: 500px;
        padding: 22px;
      }

      #figma-reasoning-detail .detail-card {
        padding: 26px 24px 30px;
        border-radius: 20px;
      }

      #figma-reasoning-detail .detail-copy { min-height: 128px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #figma-reasoning-detail .detail-fill,
      #figma-reasoning-detail .detail-thumb { transition: none; }

      #figma-reasoning-detail .detail-character {
        opacity: 1;
        filter: none;
        transform: none;
        animation: none;
      }

      #figma-reasoning-detail .detail-highlight.detail-tag-reveal {
        opacity: 1;
        filter: none;
        transform: none;
        animation: none;
      }
    }
  </style>

  <div class="detail-page">
    <div class="detail-card">
      <section class="detail-stage" aria-label="思维链文案细节度">
        <p class="detail-label" aria-live="polite">专业</p>

        <div class="detail-slider-slot">
          <div class="detail-slider-visual" aria-hidden="true">
            <div class="detail-track"></div>
            <div class="detail-fill"></div>
            <span class="detail-dot detail-dot-one"></span>
            <span class="detail-dot detail-dot-two"></span>
            <span class="detail-dot detail-dot-three"></span>
            <span class="detail-thumb"></span>
          </div>
          <input class="detail-range" type="range" min="1" max="3" step="1" value="2" aria-label="文案细节度" aria-valuetext="专业">
          <span class="detail-focus" aria-hidden="true"></span>
        </div>

        <p class="detail-copy" aria-live="polite"></p>
      </section>
    </div>
  </div>

  <script>
    (() => {
      const root = document.getElementById('figma-reasoning-detail');
      const range = root.querySelector('.detail-range');
      const label = root.querySelector('.detail-label');
      const copy = root.querySelector('.detail-copy');
      let revealTimer;

      const states = {
        1: {
          name: '简洁',
          className: 'level-one',
          html: '这个请求被重复执行了。我会找到重复触发的位置，把它改成只执行一次。'
        },
        2: {
          name: '专业',
          className: 'level-two',
          html: '状态更新触发了重复请求。我会检查 effect 和请求入口，合并重复调用，并避免旧请求覆盖新结果。'
        },
        3: {
          name: '深入',
          className: 'level-three',
          html: '<span class="detail-highlight">useEffect</span> 依赖变化触发了并发请求，可能产生 <span class="detail-highlight">race condition</span> 和 stale response。我会用 <span class="detail-highlight">AbortController</span> 取消旧请求，并验证快速切换场景。'
        }
      };

      function renderAnimatedText(html) {
        const template = document.createElement('template');
        template.innerHTML = html;
        const plainText = template.content.textContent;
        let characterIndex = 0;

        function wrapTextNodes(node) {
          if (node.nodeType === Node.TEXT_NODE) {
            const characters = document.createDocumentFragment();
            Array.from(node.nodeValue).forEach((character) => {
              const characterSpan = document.createElement('span');
              characterSpan.className = 'detail-character';
              characterSpan.setAttribute('aria-hidden', 'true');
              characterSpan.style.animationDelay = ((characterIndex * 18) + 'ms');
              characterSpan.textContent = character === ' ' ? '\u00a0' : character;
              characters.appendChild(characterSpan);
              characterIndex += 1;
            });
            node.replaceWith(characters);
            return;
          }

          if (node.nodeType === Node.ELEMENT_NODE && node.classList.contains('detail-highlight')) {
            node.classList.add('detail-tag-reveal');
            node.setAttribute('aria-hidden', 'true');
            node.style.animationDelay = ((characterIndex * 18) + 'ms');
            characterIndex += Array.from(node.textContent).length;
            return;
          }

          Array.from(node.childNodes).forEach(wrapTextNodes);
        }

        wrapTextNodes(template.content);
        copy.replaceChildren(template.content);
        copy.setAttribute('aria-label', plainText);
      }

      function update() {
        const selected = states[Number(range.value)];
        root.classList.remove('level-one', 'level-two', 'level-three');
        root.classList.add(selected.className);
        label.textContent = selected.name;
        range.setAttribute('aria-valuetext', selected.name);

        window.clearTimeout(revealTimer);
        revealTimer = window.setTimeout(() => {
          renderAnimatedText(selected.html);
        }, 60);
      }

      range.addEventListener('input', update);
      copy.innerHTML = states[2].html;
      copy.setAttribute('aria-label', copy.textContent);
      root.classList.add('level-two');
    })();
  </script>
</div>

<style>
  /* Scale the original 736 × 520 composition as one unit, like the former recording. */
  #figma-reasoning-detail {
    width: 736px;
    height: 520px;
    transform: scale(var(--demo-scale, 1));
    transform-origin: top left;
  }
  #figma-reasoning-detail .detail-page {
    width: 736px;
    height: 520px;
    min-height: 520px;
    padding: 51.52px;
  }
  #figma-reasoning-detail .detail-card {
    padding: 30px 36px 34px;
    border-radius: 24px;
  }
  #figma-reasoning-detail .detail-copy { min-height: 96px; }
</style>
<script>
  (() => {
    const fit = () => document.documentElement.style.setProperty('--demo-scale', window.innerWidth / 736);
    fit();
    window.addEventListener('resize', fit);
  })();
</script>
</body>
